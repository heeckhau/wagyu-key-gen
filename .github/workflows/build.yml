name: ci-build
run-name: ${{ github.actor }} is building binaries and drafting a release
on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  build-binaries:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 builds use the portable BLS backend so the binaries also run on CPUs without ADX.
          - os: ubuntu-22.04
            build_args: --features portable
          - os: macos-15-intel
            build_args: --features portable
          - os: macos-latest
            build_args: ""
          - os: windows-latest
            build_args: --features portable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Setup variables
        shell: bash
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c -7)
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
      - run: yarn install --immutable
      - name: Test
        shell: bash
        run: |
          yarn test
          cargo test -p wagyu-core ${{ matrix.build_args }}
      - name: Build
        shell: bash
        run: yarn tauri build ${{ matrix.build_args }}
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p output/artifacts
          # Tauri writes bundles to the workspace target dir. Rename "Wagyu Key Gen_2.0.0_x64.dmg" to
          # "Wagyu.Key.Gen_2.0.0-<sha>_x64.dmg" so the release script can map files to platforms.
          collect() {
            local file="$1"
            local name
            name=$(basename "$file")
            name="${name// /.}"
            name=$(echo "$name" | sed -E "s/([0-9]+\.[0-9]+\.[0-9]+)/\1-$SHORT_SHA/")
            mv "$file" "output/artifacts/${name}"
            echo "collected ${name}"
          }
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            for f in target/release/bundle/nsis/*-setup.exe; do collect "$f"; done
            VERSION=$(node -p "require('./package.json').version")
            cp target/release/wagyu-key-gen.exe "output/artifacts/Wagyu.Key.Gen_${VERSION}-${SHORT_SHA}_x64-portable.exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            for f in target/release/bundle/dmg/*.dmg; do collect "$f"; done
          else
            for f in target/release/bundle/appimage/*.AppImage; do collect "$f"; done
          fi
          cd output/artifacts
          for f in *; do
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              certutil -hashfile "$f" SHA256 | sed -n 2p | tr -d ' \r\n' > "$f.sha256"
            elif [[ "$RUNNER_OS" == "macOS" ]]; then
              shasum -a 256 "$f" | head -c 64 > "$f.sha256"
            else
              sha256sum "$f" | head -c 64 > "$f.sha256"
            fi
          done
          ls -la
      - name: Generate artifacts attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: output/artifacts/*
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}
          path: output/artifacts
  create-release:
    needs: [build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build binaries
        uses: actions/download-artifact@v4
        with:
          path: assets/
          pattern: binary-*
      - name: Create draft release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            var path = require('path');
            var fs = require('fs');

            var tagName = '';
            if (context.eventName == 'push') {
              const tagRegex = /(?:refs\/tags\/)?(v\d+\.\d+\.\d+)$/;

              const match = context.ref.match(tagRegex);
              if (match) {
                tagName = match[1];
              } else {
                core.setFailed(`Cannot extract the tag version from ref value '${context.ref}'.`);
              }

            } else if (context.eventName == 'workflow_dispatch') {
              tagName = `dev-${context.actor}-${context.sha.substring(0, 7)}-${context.runId}`;
            } else {
              core.setFailed(`Unhandled triggering event.`);
            }

            console.log(`Creating draft release for tag ${tagName}...`)

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              target_commitish: context.sha,
              draft: true,
              generate_release_notes: true,
            });

            console.log(`Release ${release.id} created.`);

            let binariesMap = new Map();
            const emptyBinaryObject = {
              system: null,
              architecture: null,
              binary_archive: null,
              binary_archive_download_url: null,
              binary_checksum: null,
              binary_checksum_download_url: null,
            };

            const amd64Architecture = 'x86_64';
            const arm64Architecture = 'aarch64';

            binariesMap.set('windows-amd64', Object.assign({}, emptyBinaryObject, { system: 'Windows (installer)', architecture: amd64Architecture }));
            binariesMap.set('windows-amd64-portable', Object.assign({}, emptyBinaryObject, { system: 'Windows (portable, needs WebView2)', architecture: amd64Architecture }));
            binariesMap.set('darwin-amd64', Object.assign({}, emptyBinaryObject, { system: 'macOS', architecture: amd64Architecture }));
            binariesMap.set('darwin-arm64', Object.assign({}, emptyBinaryObject, { system: 'macOS', architecture: arm64Architecture }));
            binariesMap.set('linux-amd64', Object.assign({}, emptyBinaryObject, { system: 'Linux', architecture: amd64Architecture }));

            const platformOf = (fileName) => {
              const name = fileName.replace(/\.sha256$/, '');
              if (name.endsWith('-portable.exe')) return 'windows-amd64-portable';
              if (name.endsWith('.exe')) return 'windows-amd64';
              if (name.endsWith('.AppImage')) return 'linux-amd64';
              if (name.endsWith('_aarch64.dmg')) return 'darwin-arm64';
              if (name.endsWith('.dmg')) return 'darwin-amd64';
              return null;
            };

            console.log('Uploading release assets...');

            const archivesGlobber = await glob.create('assets/*/*')
            for await (const file of archivesGlobber.globGenerator()) {
              console.log(`Uploading ${path.basename(file)} to the release ${release.id}`);

              const fileName = path.basename(file);
              const fileContent = fs.readFileSync(file);

              const { data: asset } = await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: fileName,
                data: fileContent,
              });

              const platform = platformOf(fileName);
              if (platform === null) {
                console.log(`Unknown platform for ${fileName}, skipping table entry.`);
                continue;
              }
              const binaryDetails = binariesMap.get(platform);

              if (fileName.endsWith('.sha256')) {
                binariesMap.set(platform, Object.assign({}, binaryDetails, {
                  binary_checksum: fileName,
                  binary_checksum_download_url: asset.browser_download_url,
                }));
              } else {
                binariesMap.set(platform, Object.assign({}, binaryDetails, {
                  binary_archive: fileName,
                  binary_archive_download_url: asset.browser_download_url,
                }));
              }
            }

            const binariesTable = [
              '| System  | Architecture | Binary             | Checksum               |',
              '|---------|--------------|--------------------|------------------------|'
            ];

            binariesMap.forEach((details, platform) => {
              if (
                details.binary_archive !== null &&
                details.binary_checksum !== null
              ) {
                const binaryAssetUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tagName}/${details.binary_archive}`;
                const checksumAssetUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tagName}/${details.binary_checksum}`;

                binariesTable.push(`| ${details.system} | ${details.architecture} | [${details.binary_archive}](${binaryAssetUrl}) | [sha256](${checksumAssetUrl}) |`);
              }
            });

            const binariesTableContent = binariesTable.join('\n');

            const { data: workflowRun } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });

            let releaseBodyTemplate = fs.readFileSync('.github/release_template.md', { encoding: 'utf8'});

            console.log('Removing comments in release template...');

            releaseBodyTemplate = releaseBodyTemplate.replaceAll(/^\[comment\]:\s*<>\s*\((.*?)\)\s*$/gm, '');
            releaseBodyTemplate = releaseBodyTemplate.trim();

            let releaseBody = releaseBodyTemplate.replaceAll('`[GENERATED-RELEASE-NOTES]`', release.body);
            releaseBody = releaseBody.replaceAll('`[BINARIES-TABLE]`', binariesTableContent);
            releaseBody = releaseBody.replaceAll('`[WORKFLOW-RUN-URL]`', workflowRun.html_url);

            console.log('Updating release body with generated content and template...');

            const { data: updatedRelease } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              tag_name: tagName,
              target_commitish: context.sha,
              body: releaseBody,
            });

            console.log(`Release ${updatedRelease.id} updated. Explore it on ${updatedRelease.html_url}`);
