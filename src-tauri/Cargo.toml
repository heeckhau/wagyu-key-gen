[package]
name = "wagyu-key-gen"
description = "Wagyu Key Gen: GUI for generating Ethereum validator keys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "wagyu_key_gen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wagyu-core = { path = "../crates/wagyu-core" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[features]
# x86_64 release builds: avoid ADX-only code paths in blst so older CPUs do not crash.
portable = ["wagyu-core/portable"]
